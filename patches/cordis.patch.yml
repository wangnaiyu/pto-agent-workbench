# PTO Agent 工作台的 profile 覆盖层。未指定 workspaceId 创建的会话使用
# Host 进程 cwd；保留 header 中的真实 cwd，仅将其物理持久化桶命名为 default。

- id: session-persistence-jsonl
  config:
    root: !!js dshHomePath('sessions')
    projectDirectoryAliases:
      - cwd: !!js process.cwd()
        directory: default

# Official PTO business Skills are a deployment-level provider, separate from
# preset-local project/user discovery. The explicit root keeps the workbench
# repository as the only content owner and prevents DSH bundled Skills from
# inheriting PTO product ownership.
- id: skill-filesystem
  disabled: false
  config:
    providerName: pto-bundled
    includeDefaultRoots: false
    bundledSkillDir: !!js "process.getBuiltinModule('node:path').resolve(process.env.PTO_WORKBENCH_ROOT ?? process.cwd(), 'skills/bundled')"

# Product origin is trusted profile metadata, not inferred from `bundled`, the
# provider id, or a Skill name. The Client receives only the PTO label.
- id: composer-catalog
  config:
    providerOrigins:
      - provider: pto-bundled
        source: bundled
        kind: pto

# Deterministic PTO run discovery and artifact capability inspection. This row
# is profile-owned so the generic DSH bundle carries no PTO product behavior by
# default; the tools remain constrained to each calling Session workspace.
- id: tool-pto-run
  disabled: false

# Durable proposal/query registry plus one trusted Host-only execution route
# with audit receipt, Git/PyPTO identities, atomic output reservation, and
# recognized terminal settlement. Models retain plan/get/list only.
- id: pto-experiments
  disabled: false

# Session-addressed Remote used by the durable experiment tab and user-triggered
# trusted execution. It accepts no caller path; reads never create or resume an
# Agent or Session, while execution requires the existing live Session Agent.
- id: pto-experiment-dashboard
  disabled: false

# PTO-owned transcript and details presentation for evidence-gated comparison.
- id: ui-pto-experiments
  disabled: false
